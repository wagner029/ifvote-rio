<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Contagem de Votos</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
        flex-direction: column;
        gap: 20px;
    }
    h1 { font-size: 32px; text-align: center; }
    .placar {
        display: flex;
        gap: 50px;
        font-size: 24px;
    }
    .chapa {
        background: rgba(0,0,0,0.3);
        padding: 30px 50px;
        border-radius: 20px;
        text-align: center;
        transition: all 0.3s;
    }
    .chapa:hover {
        background: rgba(0,0,0,0.5);
        transform: scale(1.05);
    }
</style>
</head>
<body>
<script>
    async function atualizarPlacar() {
        try {
            // Pergunta ao nosso servidor Node.js o resultado atual
            const resposta = await fetch('http://localhost:3000/api/resultados');
            const dados = await resposta.json();

            // O backend devolve algo como: { total_votos: 5, apuracao: { "10": 3, "20": 2 } }
            // Pegamos os valores ou colocamos 0 se ninguém tiver votado ainda
            const votosChapa10 = dados.apuracao["10"] || 0;
            const votosChapa20 = dados.apuracao["20"] || 0;

            // Atualiza o texto na tela
            document.getElementById('votosChapa1').textContent = `${votosChapa10} votos`;
            document.getElementById('votosChapa2').textContent = `${votosChapa20} votos`;
            
        } catch (error) {
            console.error("Erro ao buscar a apuração:", error);
        }
    }

    // Chama a função imediatamente ao abrir a página
    atualizarPlacar();
    
    // Configura o "ao vivo": atualiza a cada 5 segundos (5000 milissegundos)
    setInterval(atualizarPlacar, 5000);
</script>
<h1>📊 Contagem de Votos</h1>
<div class="placar">
    <div class="chapa" id="chapa1">
        <h2>Chapa 1: Mudança Jovem</h2>
        <p id="votosChapa1">0 votos</p>
    </div>
    <div class="chapa" id="chapa2">
        <h2>Chapa 2: Nova Geração</h2>
        <p id="votosChapa2">0 votos</p>
    </div>
</div>


</body>
</html>
