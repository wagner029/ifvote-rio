<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFVote - Urna Eletrônica</title>
    <style>
        /* CSS EMBUTIDO */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #27ae60;
            --error: #e74c3c;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .text-center { text-align: center; }
        .hidden { display: none !important; }
        .error { color: var(--error); font-weight: bold; margin-top: 10px; }
        .success { color: var(--accent); }
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1a252f; }
        .btn-accent { background: var(--accent); color: white; margin-top: 10px;}
        .chapas-grid { display: flex; flex-direction: column; gap: 1rem; }
        .chapa-card {
            border: 2px solid #ddd;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <section id="step-1" class="step active">
            <h2>Identificação do Aluno</h2>
            <form id="identificacao-form">
                <div class="input-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="input-group">
                    <label for="matricula">Matrícula (Exatamente 12 dígitos):</label>
                    <input type="text" id="matricula" maxlength="12" pattern="\d{12}" title="Digite os 12 números da matrícula" required>
                </div>
                <div class="input-group">
                    <label for="turma">Turma:</label>
                    <select id="turma" required>
                        <option value="">Selecione sua turma...</option>
                        <option value="1">1º Ano - Informática</option>
                        <option value="2">2º Ano - Informática</option>
                        <option value="3">3º Ano - Informática</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Continuar</button>
            </form>
            <p id="error-msg" class="error hidden"></p>
        </section>

        <section id="step-2" class="step hidden">
            <h2>Escolha sua Chapa</h2>
            <div id="chapas-container" class="chapas-grid">
                </div>
        </section>

        <section id="step-3" class="step hidden text-center">
            <h2 class="success">VOTO COMPUTADO! ✅</h2>
            <p>Seu voto foi registrado com segurança.</p>
        </section>
    </div>
    <script>
        // LÓGICA DA TELA - SEM FIREBASE EXPOSTO
        const formId = document.getElementById('identificacao-form');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const errorMsg = document.getElementById('error-msg');
        const chapasContainer = document.getElementById('chapas-container');
        
        let alunoAtual = {};

        // Chapas fixas
        const chapas = [
            { id: "10", nome: "InovIF", presidente: "João", vice: "Maria" },
            { id: "20", nome: "Voz Ativa", presidente: "Carlos", vice: "Ana" }
        ];

        // PASSO 1: Identificação
        formId.addEventListener('submit', (e) => {
            e.preventDefault();
            const matricula = document.getElementById('matricula').value;

            // Bloqueio visual rápido (a segurança real agora está no backend)
            if (localStorage.getItem(`votou_${matricula}`)) {
                errorMsg.textContent = "Este dispositivo já registrou um voto para esta matrícula.";
                errorMsg.classList.remove('hidden');
                return;
            }

            // Salva os dados na memória temporária e avança de tela
            alunoAtual = { matricula: matricula };
            errorMsg.classList.add('hidden');
            renderizarChapas();
            
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
        });

        // Renderiza os botões das chapas
        function renderizarChapas() {
            chapasContainer.innerHTML = '';
            chapas.forEach(chapa => {
                const div = document.createElement('div');
                div.className = 'chapa-card';
                div.innerHTML = `
                    <h3>Chapa ${chapa.id} - ${chapa.nome}</h3>
                    <p>Pres: ${chapa.presidente} | Vice: ${chapa.vice}</p>
                    <button class="btn btn-accent votar-btn" data-id="${chapa.id}">CONFIRMAR VOTO</button>
                `;
                chapasContainer.appendChild(div);
            });

            document.querySelectorAll('.votar-btn').forEach(btn => {
                btn.addEventListener('click', (e) => confirmarVoto(e.target.getAttribute('data-id')));
            });
        }

        // PASSO 2: Envio do voto para a API Node.js
        async function confirmarVoto(chapaId) {
            const confirma = confirm(`Tem certeza que deseja votar na chapa ${chapaId}?`);
            if (!confirma) return;

            try {
                // Chama a nossa rota POST
                const resposta = await fetch('http://localhost:3000/api/votar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        matricula: alunoAtual.matricula,
                        chapaId: chapaId
                    })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    // Voto computado com sucesso
                    localStorage.setItem(`votou_${alunoAtual.matricula}`, "true");
                    step2.classList.add('hidden');
                    step3.classList.remove('hidden');
                } else {
                    // Backend barrou o voto (matrícula inválida ou voto duplo)
                    alert("Atenção: " + dados.erro);
                    // Volta para a tela inicial
                    step2.classList.add('hidden');
                    step1.classList.remove('hidden');
                    document.getElementById('matricula').value = '';
                }
            } catch (error) {
                alert("Erro de conexão com o servidor. Chame a comissão eleitoral.");
                console.error(error);
            }
        }
    </script>
    
</body>
</html>
